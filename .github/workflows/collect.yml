# 깃허브가 하루 4번 알아서 기상자료를 받아 화면을 갱신하는 설정입니다.
#
# 무슨 일이 벌어지나
# ------------------
#  1) 깃허브가 빌려주는 리눅스 컴퓨터가 잠깐 켜집니다 (무료)
#  2) 저장해 둔 데이터베이스(weather.db)를 내려받습니다
#  3) ECMWF·NOAA·met.no·기상청에서 자료를 받아 DB에 넣습니다
#  4) 화면용 파일(web/data/*.json)을 새로 만듭니다
#  5) 커진 DB는 다시 'Releases' 칸에 올려 둡니다 (다음 실행 때 씀)
#  6) web/ 폴더를 통째로 꾸러미로 만들어 웹페이지로 배포합니다
#
# ※ 화면용 파일은 저장소에 커밋하지 않습니다.
#   배포는 위 6번의 '꾸러미'에서 이뤄지므로 커밋할 이유가 없고,
#   grid.json 이 786 KB 라 하루 4번 커밋하면 저장소만 계속 불어납니다.
#
# 왜 DB를 Releases 에 두나
# -----------------------
# DB는 매일 커지는 파일이라 저장소에 매번 커밋하면 이력이 무거워집니다.
# Releases 칸은 파일 하나를 '덮어쓰기' 할 수 있어 이력이 쌓이지 않습니다.

name: 기상자료 수집

on:
  schedule:
    # 시각은 UTC(세계표준시) 기준입니다. 한국시간 = UTC + 9시간.
    # ECMWF 모델이 다 나온 뒤를 노려서 잡았습니다.
    - cron: "15 8 * * *"    # 한국시간 17:15  (00 UTC 모델)
    - cron: "15 12 * * *"   # 한국시간 21:15  (06 UTC 모델)
    - cron: "15 20 * * *"   # 한국시간 05:15  (12 UTC 모델)
    - cron: "15 0 * * *"    # 한국시간 09:15  (18 UTC 모델)
  workflow_dispatch:        # 깃허브 화면에서 손으로 눌러 돌릴 때 씀

permissions:
  contents: write           # Releases 에 DB 파일 올리기
  pages: write              # 웹페이지 배포
  id-token: write           # 웹페이지 배포에 필요한 인증

# 앞 작업이 아직 돌고 있으면 새로 시작하지 않고 기다립니다.
# (DB를 두 곳에서 동시에 고치면 꼬입니다.)
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v7

      - name: 파이썬 준비
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 부품 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import eccodes; print('GRIB 해독기 준비됨:', eccodes.codes_get_api_version())"

      - name: 저장해 둔 데이터베이스 가져오기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          # db 라는 이름의 Release 에서 weather.db.gz 를 내려받습니다.
          # 맨 처음 실행이라 없으면 그냥 넘어가고, 빈 DB로 새로 시작합니다.
          if gh release download db --pattern weather.db.gz --dir data --clobber; then
            gunzip -f data/weather.db.gz
            echo "기존 DB 사용 ($(du -h data/weather.db | cut -f1))"
          else
            echo "기존 DB 없음 → 새로 만듭니다"
          fi

      - name: 기상자료 수집
        env:
          KMA_HUB_API_KEY: ${{ secrets.KMA_HUB_API_KEY }}
        run: |
          PYTHONPATH=src python -m weather.collect all

      - name: 데이터베이스 다시 올려두기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gzip -kf data/weather.db
          gh release view db >/dev/null 2>&1 || \
            gh release create db --title "데이터베이스 보관" \
              --notes "자동 수집이 쓰는 SQLite 파일입니다. 손대지 마세요."
          gh release upload db data/weather.db.gz --clobber

      - name: 웹페이지 꾸러미 만들기
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 웹페이지 배포
        id: deployment
        uses: actions/deploy-pages@v5
