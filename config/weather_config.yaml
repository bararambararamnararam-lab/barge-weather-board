# ============================================================================
# 한·중 바지선 운항 기상 조회 설정
# ----------------------------------------------------------------------------
# 이 파일은 "설정 파일"이다. 프로그램 코드가 아니다.
# 값을 바꾸고 저장하면 프로그램 동작이 바뀐다. 코드는 건드릴 필요 없다.
#
# 규칙 3가지만 지키면 된다.
#   1) 들여쓰기는 반드시 '공백(스페이스)' 2칸. 탭(Tab) 키 쓰면 안 된다.
#   2) 콜론(:) 뒤에는 항상 공백 1칸.
#   3) '#' 으로 시작하는 줄은 설명(주석)이다. 프로그램이 무시한다.
#
# 좌표계: WGS84 십진수 / 표시 시간대: Asia/Seoul (KST)
# ============================================================================

settings:
  timezone: Asia/Seoul
  # 예보를 며칠 앞까지 받을지.
  #
  # 자료 출처가 ECMWF(유럽중기예보센터) 로 바뀌면서 10일로 정했다.
  # 예전 Open-Meteo 는 14일을 줬지만 해양(파고)이 실제로는 9~10일까지만
  # 나와서 11~14일차는 늘 '데이터 없음' 이었다. 그래서 10일로 맞췄다.
  #
  # 받는 시간 간격 (src/weather/sources/ecmwf_open.py 의 build_steps)
  #   0~72시간   : 3시간 간격  (출항 판단이 중요한 구간)
  #   78~240시간 : 6시간 간격  (추세만 본다)
  forecast_days: 10
  # 원본 데이터 간격(고정값, 바꾸지 말 것)
  source_resolution: hourly
  # 화면을 처음 열었을 때의 시간 간격. "1h" 또는 "3h"
  default_display_resolution: 3h

# ----------------------------------------------------------------------------
# 수집 주기 (분 단위)
# ----------------------------------------------------------------------------
# ============================================================================
# ECMWF 자료를 어디서 받을지
# ----------------------------------------------------------------------------
# ECMWF 본서버(data.ecmwf.int)는 전 세계가 같이 쓰다 보니 자주 막힌다.
# 막히면 "429 Too Many Requests" 가 뜨고 2분씩 기다렸다 다시 받느라
# 수집이 몇 분씩 늘어난다.
#
# 같은 자료가 아마존(aws)·마이크로소프트(azure)·구글(google) 클라우드에도
# 그대로 복제돼 있다. 클라우드 쪽은 이런 제한이 사실상 없다.
#
# 실측(2026-09-06, 같은 파일 4 MB 기준):
#     google  3.1초   <- 가장 빠름
#     ecmwf   7.5초
#     azure  11.3초
#     aws    11.5초
#
# 고를 수 있는 값: google / aws / azure / ecmwf
# 구글에 문제가 생기면 ecmwf 로 바꾸면 된다. 자료 내용은 완전히 같다.
# ============================================================================
ecmwf_download:
  source: google

  # 그래도 막혔을 때 몇 초 기다렸다 다시 받을지.
  # 본서버 기본값이 120초라 한 번 막히면 2분을 통째로 버렸다.
  retry_wait_seconds: 20

  # 다시 받는 횟수. 기본값 500번은 너무 많다(막히면 하루 종일 매달린다).
  max_retries: 15

collection:
  forecast_interval_minutes: 180   # 예보: 3시간마다
  warning_interval_minutes: 30     # 기상특보: 30분마다
  request_timeout_seconds: 30
  retry_count: 3
  retry_wait_seconds: 5

# ----------------------------------------------------------------------------
# 데이터 보존 기간 (단위: 일)
#
# 저장 방식이 3단계로 나뉜다. 지점을 20곳까지 늘려도 용량이 터지지 않게 한 구조다.
#
#   1단계 원본   : 3시간마다 수집한 것 전부. 9항목, 3~6시간 간격, 10일 앞까지.
#                 화면에 지금 보이는 표는 항상 여기서 나온다.
#   2단계 아카이브: 하루 1개(09시 근방)만 골라 7항목, 3시간 간격, 7일 앞까지로 줄인 것.
#                 '그때 예보가 어땠나'를 오래 보기 위한 것.
#   3단계 실황   : 수집 시점의 현재값. 예보가 아니다. 전체 항목 그대로.
#
# null 을 넣으면 그 종류는 지우지 않는다(영구 보관).
# ----------------------------------------------------------------------------
retention:
  raw_snapshot_days: 7        # 1단계 원본 스냅샷
  archive_days: 365           # 2단계 아카이브 (1년)
  observation_days: 730       # 3단계 과거 실황 (2년)
  warning_days: 730           # 기상특보 기록 (2년)
  # 원본을 지운 자리를 파일에서 실제로 회수하는 주기(수집 몇 회마다 한 번).
  # 0 이면 회수하지 않는다. 회수할 때 몇 초 멈춘다.
  vacuum_every_n_runs: 24

# ----------------------------------------------------------------------------
# 지도 격자 (바다를 칸으로 나눠 색을 칠하는 기능)
#
#   지점 15곳만 점으로 찍는 것과 별개로, 항로가 지나는 바다 전체에 격자를 깔고
#   칸마다 예보를 받아 색을 칠한다. 기상청 특보 지도처럼 '면'으로 보인다.
#
#   ★ 격자 색에는 기상청 특보가 반영되지 않는다.
#     임의의 바다 좌표가 어느 특보구역에 드는지 알 수 없기 때문이다.
#     격자 색 = 풍속·돌풍·파고·시정 숫자 기준만.
#     특보까지 반영한 판정은 지점 동그라미에만 나온다.
#
#   enabled       : false 로 두면 격자를 아예 받지 않는다(수집이 빨라진다)
#   step_deg      : 날씨를 물어보는 간격(도). 0.5 = 약 55 km. 호출 비용이 여기서 난다
#   mask_step_deg : 화면에 그리는 칸 크기(도). 0.25 = 약 28 km
#                   날씨 격자보다 잘게 쪼개서 해안선을 깔끔하게 만든다.
#                   날씨는 부모 칸 값을 쓰므로 이걸 줄여도 API 호출은 안 늘어난다.
#   margin_deg    : 항로 바깥으로 얼마나 더 넓게 볼지(도)
#   step_hours    : 격자에 담을 시간 간격
# ----------------------------------------------------------------------------
grid:
  enabled: true
  # 그리는 칸 크기(도). 0.25 = 약 28 km, ECMWF 격자와 같다.
  mask_step_deg: 0.25
  # 항로 바깥으로 얼마나 더 넓게 볼지(도)
  margin_deg: 1.0

# ----------------------------------------------------------------------------
# 아카이브(2단계) 만드는 규칙
#   target_hour  : 하루 중 어느 시각 수집분을 대표로 남길지 (한국시간)
#   hour_window  : 목표 시각에서 이만큼 벗어난 것까지는 허용. 넘으면 그날은 건너뜀
#   forecast_days: 아카이브에 담을 예보 범위 (원본은 10일, 아카이브는 7일)
#   step_hours   : 아카이브 시간 간격 (원본은 1시간, 아카이브는 3시간)
# ----------------------------------------------------------------------------
archive:
  target_hour: 9
  hour_window: 6
  forecast_days: 7
  step_hours: 3

# ----------------------------------------------------------------------------
# 위치 목록
#   새 지점을 추가하려면 아래 형식 그대로 복사해서 붙여넣고 값만 바꾼다.
#   kma_zones: 이 지점에 적용할 기상청 특보구역 코드 목록.
#              한국 관할 해역/육상만 값이 있고, 중국 지점은 빈 목록 [] 이다.
#              (기상청 특보는 중국 해역을 다루지 않는다.)
# ----------------------------------------------------------------------------
locations:
  GOHYEON:
    name: "거제 고현항"
    latitude: 34.926222
    longitude: 128.598083
    type: port
    country: KR
    kma_zones:
      - S1311300   # 경남중부남해앞바다 (해상 풍랑특보)
      - S2320800   # 경남중부남해앞바다중 연안바다 (연안 세부구역)
      - L1082200   # 거제시 (육상 강풍·호우·태풍 등)

  LIDAO_ANCH:
    name: "영성 묘박지"
    latitude: 37.274361
    longitude: 122.739361
    type: anchorage
    country: CN
    kma_zones: []

  SAMSUNG_YR:
    name: "영성법인"
    latitude: 37.276722
    longitude: 122.562556
    type: terminal
    country: CN
    kma_zones: []

  GAYA_YR:
    name: "영성가야"
    latitude: 37.258083
    longitude: 122.579250
    type: terminal
    country: CN
    kma_zones: []

  NANTONG_ANCH:
    name: "난퉁 묘박지"
    latitude: 32.130833
    longitude: 121.707000
    type: anchorage
    country: CN
    kma_zones: []

  YANDA_PORT:
    name: "난퉁 CSME"
    latitude: 32.134111
    longitude: 121.457278
    type: port
    country: CN
    kma_zones: []

  # ==========================================================================
  # 항로 중간 해상 지점 (웨이포인트)
  # --------------------------------------------------------------------------
  # 모든 좌표는 실제로 조회해서 값이 나오는지 확인했다.
  # 전부 바다 격자(표고 0 m)이고 파고 데이터가 정상으로 나온다.
  #
  # ★ kma_zones 는 좌표로 추정한 값이다. 기상청이 특보구역 경계 좌표를
  #   공개하지 않아 100% 확정할 수 없다. 아래 '확도' 표시를 참고하고,
  #   실제 특보와 어긋나면 이 목록만 고치면 된다.
  #     확실  = 구역 이름이 그 위치를 그대로 가리킴
  #     보통  = 구역 경계에서 떨어져 있어 대체로 맞음
  #     경계  = 두 구역 경계 부근이라 확인 필요
  # ==========================================================================

  # ── R1·R2·R3 공통 구간 (고현항 출항 직후) ────────────────────────────
  # ---------------------------------------------------------------------
  # 길을 꺾기 위한 점 (geometry_only)
  #
  # 고현항에서 곧장 동쪽으로 선을 그으면 거제도 육지를 뚫고 지나간다.
  # 실제로는 북쪽으로 나가 거제도 위를 돌아서 동쪽으로 내려간다.
  # 그 '돌아가는 길' 을 나타내는 두 점이다.
  #
  # geometry_only: true 는 "거리 계산과 지도 선에만 쓰고 기상은 받지 않는다"
  # 는 뜻이다. 좁은 내만이라 따로 기상을 볼 이유가 없고,
  # 목록·표에도 나오지 않는다.
  # ---------------------------------------------------------------------
  GOHYEON_N:
    name: "고현 북방"
    latitude: 35.0203397
    longitude: 128.6006632
    type: route_waypoint
    country: KR
    geometry_only: true
    kma_zones: []

  GEOJE_N:
    name: "거제 북방"
    latitude: 35.0479664
    longitude: 128.7241862
    type: route_waypoint
    country: KR
    geometry_only: true
    kma_zones: []

  GEOJE_E:
    name: "거제 동방"
    latitude: 34.9127201
    longitude: 128.8119388
    type: route_waypoint
    country: KR
    # 장승포 동북동 11 km / 고현항 동쪽 20 km
    kma_zones:
      - S1311400   # 거제시동부앞바다 [확실] 구역명이 이 위치를 그대로 가리킴

  YEOSU_S:
    name: "여수 남방"
    latitude: 34.4549655
    longitude: 127.8918945
    type: route_waypoint
    country: KR
    # 여수항 남남동 34 km / 남해도 남쪽 43 km (약 23 해리 = 먼바다)
    kma_zones:
      - S1312010   # 남해동부안쪽먼바다 [경계] 남해동부/서부 경계 부근. 확인 필요

  # ── R1·R2 전용: 서해를 북상해 산둥반도로 ─────────────────────────────
  JINDO_S:
    name: "진도 남방"
    latitude: 34.2564311
    longitude: 126.2751563
    type: route_waypoint
    country: KR
    # 진도 남쪽 26 km / 추자도 북쪽 34 km (제주해협 서쪽 입구)
    kma_zones:
      - S1322100   # 남해서부서쪽먼바다 [보통]

  HEUKSAN_N:
    name: "흑산도 북방"
    latitude: 34.8617403
    longitude: 125.4728074
    type: route_waypoint
    country: KR
    # 흑산도 북쪽 20 km / 홍도 북동 32 km
    kma_zones:
      - S1232210   # 서해남부남쪽안쪽먼바다 [보통]

  SEOHAE_S:
    name: "서해 남부 먼바다"
    latitude: 35.6236764
    longitude: 124.4700537
    type: route_waypoint
    country: KR
    # 가장 가까운 육지가 홍도 123 km. 서해 한복판이다.
    # 한중 중간선(약 123°E)보다 동쪽이라 한국 관할 해역으로 본다.
    kma_zones:
      - S1232120   # 서해남부북쪽바깥먼바다 [경계] 서해중부/남부 경계 부근. 확인 필요

  SHIDAO_E:
    name: "스다오 동방"
    latitude: 36.7687648
    longitude: 123.1970510
    type: route_waypoint
    country: CN
    # 스다오(石島) 동쪽 69 km / 리따오 묘박지 북서 69 km
    # 한중 중간선 서쪽 = 중국 관할. 기상청 특보 범위 밖이다.
    kma_zones: []

  # ── R3 전용: 제주해협을 지나 남서진해 장쑤성으로 ──────────────────────
  JEJU_STRAIT:
    name: "제주해협"
    latitude: 33.7652570
    longitude: 126.4441365
    type: route_waypoint
    country: KR
    # 추자도 남쪽 24 km / 제주시 북쪽 29 km. 해협 한가운데다.
    kma_zones:
      - S1323100   # 제주도북부앞바다 [경계] 앞바다/먼바다 경계 부근. 확인 필요

  IEODO_NE:
    name: "이어도 북동방"
    latitude: 33.1603540
    longitude: 124.1919391
    type: route_waypoint
    country: KR
    # 이어도 종합해양과학기지 북서 148 km / 가거도 남서 133 km
    # 제주시에서 서쪽으로 약 220 km 떨어진 곳이다. '제주 서부 앞바다'가 아니다.
    # 한중 중첩수역이고 기상청 먼바다 구역 서쪽 끝을 벗어난다.
    kma_zones: []

  YANDA_E:
    name: "난퉁 동방"
    latitude: 32.4450636
    longitude: 122.5938199
    type: route_waypoint
    country: CN
    # 얀다항 동북동 112 km / 난퉁 동북동 167 km (장강 하구 진입 해역)
    kma_zones: []

  # ── 지점을 더 추가하려면 ──────────────────────────────────────────────
  # 위 형식을 그대로 복사해 붙이고 값만 바꾼다. 그 다음 routes 의
  # waypoints 목록에 그 ID를 항해 순서대로 넣어야 화면에 나온다.
  # 반드시 '실제로 배가 지나가는 바다 위 좌표'만 넣는다. 직선 보간 금지.

# ----------------------------------------------------------------------------
# 항로 목록
#   endpoints: 출발·경유·도착 고정 지점 (순서대로)
#   waypoints: 그 사이 실제 항해 경로의 해상 지점 (지금은 비어 있음)
#   화면에는 endpoints + waypoints 가 항해 순서대로 합쳐져 표시된다.
# ----------------------------------------------------------------------------
#   endpoints : 출발·경유·도착 고정 지점
#   waypoints : 출발지 다음에 끼워 넣을 해상 지점을 항해 순서대로
#   화면에는 [출발지] + [waypoints 순서대로] + [나머지 endpoints] 로 표시된다.
#   short        : 화면 단추와 엑셀 파일 이름에 쓰는 짧은 이름.
#                  R1/R3 은 프로그램 안에서만 쓰는 이름이고, 사람에게는 short 만 보인다.
#   endpoints    : 출발지 → (경유지들) 로 이어지는 한 줄짜리 경로
#   waypoints    : 출발지 다음에 끼워 넣을 해상 지점 (항해 순서대로)
#   destinations : 마지막 경유지에서 '갈라지는' 도착지들.
#                  같은 길로 가다가 끝에서만 갈리는 경우 항로를 따로 만들 필요가 없다.
#                  지도에서는 마지막 경유지부터 각 도착지로 가지가 뻗는다.
routes:
  R1:
    short: "영성"
    name: "고현항 ↔ 영성(법인·가야)"
    # 고현항 → 거제 동방 → 여수 남방 → 진도 남방 → 흑산도 북방
    #        → 서해 남부 먼바다 → 스다오 동방 → 영성 묘박지
    endpoints: [GOHYEON, LIDAO_ANCH]
    waypoints: [GOHYEON_N, GEOJE_N, GEOJE_E, YEOSU_S, JINDO_S, HEUKSAN_N, SEOHAE_S, SHIDAO_E]
    # 영성 묘박지에서 둘로 갈라진다. 여기까지 오는 길은 완전히 같다.
    destinations: [SAMSUNG_YR, GAYA_YR]

  R3:
    short: "CSME"
    name: "고현항 ↔ 난퉁(CSME)"
    # 고현항 → 거제 동방 → 여수 남방 → 제주해협 → 이어도 북동방
    #        → 난퉁 동방 → 난퉁 묘박지 → 난퉁 CSME
    endpoints: [GOHYEON, NANTONG_ANCH]
    waypoints: [GOHYEON_N, GEOJE_N, GEOJE_E, YEOSU_S, JEJU_STRAIT, IEODO_NE, YANDA_E]
    destinations: [YANDA_PORT]

# ============================================================================
# 운항 한계값
# ----------------------------------------------------------------------------
# ★ 경고: 아래 숫자는 '화면 경보용 MVP 초안'이다.
#    자동 출항 승인 기준이 아니고, 법정 운항 한계도 아니다.
#    선박별 안전관리매뉴얼과 항만/VTS 지시로 반드시 재검토해서 확정해야 한다.
#
# 읽는 법:
#   caution_at    : 이 값 '이상'이면 노랑(주의)
#   unavailable_at: 이 값 '이상'이면 빨강(불가)
#   caution_below    : 이 값 '미만'이면 노랑 (시정처럼 낮을수록 나쁜 항목)
#   unavailable_below: 이 값 '미만'이면 빨강
# ============================================================================
# 항해 소요 시간 (ETA)
# ----------------------------------------------------------------------------
# "지금 이 지점에 있는 배가 목적지까지 몇 시간 걸릴까" 를 계산할 때 쓰는 값이다.
#
# 계산 방법
#   1) 지점 사이 거리는 좌표로 자동 계산한다 (고현항~영성 404 해리).
#   2) 배를 1시간씩 전진시키면서, 그 시각·그 구간의 운항 판단을 본다.
#      - 가능(초록)   : 아래 service_speed_kn 그대로
#      - 조건부(노랑) : service_speed_kn x caution_factor
#      - 불가(빨강)   : 멈추고 기다린다 (기상이 나아질 때까지)
#   3) 배가 3번 지점을 지날 때는 몇 시간 뒤이므로 '그때의 예보' 를 쓴다.
#      지금 기상만 보고 끝까지 계산하지 않는다.
#
# ★ 아래 숫자는 "기상 문제가 없으면 고현~영성 55~60시간" 이라는 실제 경험에서
#   거꾸로 잡은 값이다(404해리 / 57.5시간 = 약 7.0 노트).
#   실제 예선 성능·화물 상태에 맞게 고쳐 쓰면 된다.
# ============================================================================
voyage:
  # 배 종류별 기준 속력(노트). 기상이 좋을 때의 속력이다.
  #
  # ★ 실제 운항 기록과 맞춰 확인한 값이다 (고현~영성 414.6 해리 기준).
  #
  #   바지선 6.5노트 -> 63.8시간
  #     월요일 17시에 고현을 떠나면 목요일 08:47 도착.
  #     실제로 "17시 출항하면 3일째 아침에 도착해 있다" 와 일치한다.
  #
  #   자항선 9.0노트 -> 46.1시간
  #     월요일 17시 출항이면 수요일 15시 도착.
  #     실제로 "자항선은 48시간 전후" 와 일치한다.
  #
  # 이 숫자를 고치면 화면의 소요 시간이 바로 따라 바뀐다.
  vessels:
    - id: barge
      name: "예인선+바지선"
      short: "바지선"
      speed_kn: 6.5
    - id: self_propelled
      name: "자항선"
      short: "자항선"
      speed_kn: 9.0

  # 조건부(노랑) 구간에서 얼마나 느려지는지. 0.75 = 원래 속력의 75%
  caution_factor: 0.75

  # 불가(빨강) 구간을 만나면 어떻게 할지
  #   true  : 그 자리에서 기다린다 (실제 운항에 가깝다)
  #   false : 그냥 통과한다 (기상을 무시한 최소 시간만 보고 싶을 때)
  wait_when_unavailable: true

  # 기다리는 시간이 이 값을 넘으면 "예보 기간 안에는 못 감" 으로 표시한다(시간)
  max_wait_hours: 72

# ============================================================================
operational_thresholds:
  wind_speed_ms:
    caution_at: 10.0
    unavailable_at: 12.0
    basis: "소형(10,000 DWT 미만) 선박의 접·이안 제한 예시를 보수적으로 적용"

  wind_gust_ms:
    caution_at: 14.0
    unavailable_at: 16.0
    basis: "지속풍 기준보다 4 m/s 높은 돌풍 경보용 보수값; 선박별 확정 필요"

  # ★ 2026-09-06 변경: 0.5 / 1.0 -> 1.5 / 2.5
  #
  # 바꾼 이유:
  #   0.5 / 1.0 은 OILHUB 터미널의 '접안·하역' 제한에서 가져온 값이었다.
  #   항로 중간 해상 지점을 넣고 실제 예보를 조회해 보니, 그 기준으로는
  #   항해 구간 대부분이 상시 빨강이 되어 경보로서 의미가 없었다.
  #     - 얀다항 동방 해상: 예보 기간 내내 파고가 0.9 m 아래로 내려가지 않음 (88%가 빨강)
  #     - 이어도 북동방 해상: 70%가 빨강 / 제주해협: 56%가 빨강
  #     - 전체 지점의 70%가 0.5 m 이상 = 노랑이 기본 상태
  #   그래서 '항해 중 기준'으로 통일했다.
  #
  # ★ 주의: 이 값은 항만 접안·하역 기준이 아니다.
  #   고현항·얀다항 등에서 실제 접안 작업을 할 때는 이 화면 색만 보지 말고
  #   해당 터미널·VTS 기준을 따로 확인해야 한다.
  #   접안 지점만 엄격하게 하려면 지점 종류(type)별 한계값 분리가 필요하다.
  wave_height_m:
    caution_at: 1.5
    unavailable_at: 2.5
    basis: "항해 중 기준. 풍랑주의보 유의파고 3 m 보다 보수적으로 잡은 값. 접안·하역 기준이 아님"

  visibility_km:
    caution_below: 3.0
    unavailable_below: 1.852
    basis: "1 해리(1.852 km) 미만에서 VTS 지시를 따르도록 한 항만 사례를 불가 경보 시작점으로 사용"

  # 강수·뇌우: 아래 값 이상이면 '조건(노랑)'으로 본다.
  precipitation_mm:
    caution_at: 5.0
    unavailable_at: null      # null = 이 항목만으로는 '불가' 판정을 내리지 않음
    basis: "시간당 5 mm 이상이면 갑판 작업·시야에 영향이 있다고 보고 주의 표시"

  # ※ 지금은 쓰이지 않는다. 자료원이 ECMWF+NOAA 로 바뀌면서 뇌우지수를
  #    받지 않기 때문이다. 나중에 다시 받게 되면 이 값이 그대로 적용된다.
  cape_jkg:
    caution_at: 1000.0
    unavailable_at: null
    basis: "CAPE 1000 J/kg 이상이면 뇌우 발달 가능. (현재 자료원에 없음)"

  # 해류: 공통 수치 한계를 적용하지 않는다. 화면에는 숫자만 보여준다.
  # ※ 해류는 ECMWF·NOAA 둘 다 제공하지 않아 화면에서 뺐다.
  current_speed_kn:
    automatic_judgement: false
    basis: "선박별로 달라 공통 한계를 두지 않음. (현재 자료원에 없음)"

# ----------------------------------------------------------------------------
# 기상특보를 운항 판단에 반영하는 규칙
#   기상청 LVL 값 → 판정
#     예비  : preliminary
#     주의  : advisory   (주의보)
#     경보  : warning
#   판정 값은 normal / condition / unavailable 중 하나.
# ----------------------------------------------------------------------------
kma_warning_rules:
  by_level:
    예비: condition
    주의: condition
    경보: unavailable
  # 특보종류(WRN)별로 위 규칙을 덮어쓰고 싶을 때 사용한다.
  by_type_override:
    태풍: unavailable
  # 아래 목록에 있는 특보종류는 운항 판단에서 무시한다(화면에는 계속 표시).
  ignore_types:
    - 황사
    - 폭염
    - 한파
    - 건조

# ----------------------------------------------------------------------------
# 한계값 근거 자료
# ----------------------------------------------------------------------------
threshold_references:
  - name: "OILHUB Korea terminal regulations"
    url: "https://en.okyc.co.kr/file/OKYC_Terminal_Information_and_Regulation.pdf"
    use: "10,000 DWT 미만 선박의 접·이안/작업 제한 사례 및 시정 1해리 사례"
  - name: "KMA weather-warning issuance criteria"
    url: "https://devweather-super.kma.go.kr/neng/forecast/warning.do"
    use: "풍랑주의보(풍속 14 m/s 지속 또는 유의파고 3 m) 및 풍랑경보(21 m/s 또는 5 m) 기준"
  - name: "Australian Maritime Safety Authority barge towage guidance"
    url: "https://www.amsa.gov.au/construction-barge-safety/towing-and-pushing-smaller-construction-barges"
    use: "바지선 운항은 바람·조류·조석·화물·예인선 등을 포함한 개별 위험평가가 필요하다는 근거"
