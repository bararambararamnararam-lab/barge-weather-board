<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="color-scheme" content="light dark">
<title>바지선 운항 기상</title>
<script>
  /* 화면을 그리기 전에 밝기를 먼저 정한다.
     app.js 는 문서 끝에서 읽히기 때문에, 거기서 정하면 밝은 화면이
     한 번 번쩍였다가 어두워진다. 그래서 여기서 미리 붙여 둔다.
     고른 적이 없으면 어두운 화면으로 시작한다. */
  (function () {
    var mode = null;
    try { mode = localStorage.getItem("theme"); } catch (e) {}
    document.documentElement.setAttribute("data-theme", mode || "dark");
  })();
</script>
<link rel="stylesheet" href="app.css?v=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>

<!-- ===== 맨 위 고정 막대 ===== -->
<header class="top">
  <div class="top-row">
    <h1 id="appTitle">바지선 운항 기상</h1>
    <button id="qrBtn" class="icon-btn" type="button" aria-label="주소 QR 보여주기">QR</button>
    <button id="themeBtn" class="icon-btn" type="button" aria-label="밝기 바꾸기">☀</button>
    <button id="reloadBtn" class="icon-btn" type="button" aria-label="새로고침">↻</button>
  </div>
  <nav class="chips" id="routeChips" aria-label="항로 선택"></nav>
  <nav class="chips" id="wayChips" aria-label="가는 방향"></nav>
  <!-- 요약(신호등)은 여기에 고정한다. 지도를 보든 표를 보든 늘 보인다. -->
  <div id="summaryBanner" class="banner"></div>
</header>

<!-- ===== 본문 ===== -->
<main id="main">

  <!-- 요약 화면 -->
  <section id="viewSummary" class="view">
    <div id="locList" class="cards"></div>
    <p class="foot-note" id="stalenessNote"></p>
    <p class="foot-note" id="sourceNote"></p>
  </section>

  <!-- 지점 상세 화면 -->
  <section id="viewDetail" class="view" hidden>
    <div class="detail-head">
      <button id="detailBack" class="back" type="button">‹ 목록</button>
      <div>
        <h2 id="detailName">지점</h2>
        <p id="detailSub" class="sub"></p>
      </div>
    </div>
    <div id="detailEta" class="etabox"></div>
    <nav class="chips scroll" id="metricChips" aria-label="항목 선택"></nav>
    <div id="detailWarn" class="warnbox" hidden></div>
    <div id="detailList" class="timeline"></div>
    <details class="histbox" id="detailHistory">
      <summary>지난 기록 보기</summary>
      <div id="detailHistBody"></div>
    </details>
  </section>

  <!-- 지도 화면 -->
  <section id="viewMap" class="view" hidden>
    <div class="maptools">
      <button id="gridToggle" class="chip on" type="button">해역 색칠 켜짐</button>
      <span class="legend">
        <i class="lg lg-n"></i>가능
        <i class="lg lg-c"></i>조건
        <i class="lg lg-u"></i>불가
      </span>
    </div>
    <div id="map" class="map"></div>
    <details class="mapnote">
      <summary>지도 보는 법</summary>
      <p id="gridNote"></p>
    </details>
  </section>

  <!-- 기상특보 화면 -->
  <section id="viewWarn" class="view" hidden>
    <div id="warnRoute"></div>
    <details class="allwarn">
      <summary>전국 특보 현황 전체 보기</summary>
      <div id="warnAll"></div>
    </details>
    <details class="histbox" id="warnHistory">
      <summary>지난 특보 기록</summary>
      <div id="warnHistBody"></div>
    </details>
  </section>

  <!-- 넓은 화면에서만 나오는 격자 표 -->
  <section id="viewGrid" class="view" hidden>
    <nav class="chips scroll" id="gridChips" aria-label="표 항목 선택"></nav>
    <div id="gridWrap" class="gridwrap"></div>
    <div id="gridLegend" class="gridlegend"></div>
  </section>

</main>

<!-- ===== 아래 고정: 시간 막대 + 탭 =====
     시간 막대를 아래에 둔 이유: 지도를 보며 시각을 옮길 때
     엄지로 바로 닿는 자리가 화면 아래쪽이기 때문이다. -->
<div class="timebar" id="timebar">
  <button id="timePrev" class="step" type="button" aria-label="이전 시각">‹</button>
  <div class="timebox">
    <input id="timeRange" type="range" min="0" max="0" value="0" step="1"
           aria-label="표시할 시각">
    <div id="timeLabel" class="timelabel">—</div>
  </div>
  <button id="timeNext" class="step" type="button" aria-label="다음 시각">›</button>
  <button id="timeNow" class="now" type="button">지금</button>
</div>

<nav class="tabbar" id="tabbar" aria-label="화면 전환">
  <button data-view="summary" class="tab on" type="button"><span>목록</span></button>
  <button data-view="map" class="tab" type="button"><span>지도</span></button>
  <button data-view="grid" class="tab" type="button"><span>표</span></button>
  <button data-view="warn" class="tab" type="button"><span>특보</span></button>
</nav>

<!-- 옆 사람에게 주소를 알려 줄 때 쓰는 QR.
     ★ QR 은 어두운 화면에서도 흰 바탕에 검정이어야 한다.
       색을 뒤집으면 스캐너가 못 읽는 일이 많다. 그래서 이 카드 안쪽만
       테마와 무관하게 흰색으로 고정한다. -->
<div id="qrModal" class="modal" hidden>
  <div class="modal-back" id="qrBack"></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
    <h2 id="qrTitle">폰 카메라로 찍으세요</h2>
    <div class="qr-plate">
      <img src="qr.svg" alt="사이트 주소 QR 코드" width="240" height="240">
    </div>
    <p class="qr-url">tinyurl.com/barge-weather</p>
    <div class="qr-btns">
      <button id="qrCopy" class="qr-act" type="button">주소 복사</button>
      <button id="qrClose" class="qr-act primary" type="button">닫기</button>
    </div>
  </div>
</div>

<div id="loading" class="loading">불러오는 중…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js?v=1"></script>
</body>
</html>
